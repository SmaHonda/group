<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>團體預約管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#faf6f0;--panel:#fff;--ink:#2b3a4f;--sub:#6c7a8f;--bd:#2b3a4f;--acc:#9fb0e6;--accd:#3f54a8;--hl:#eef1fd;--ok:#2f7d5b;--warn:#c47a12;--bad:#c0392b;--or:#f0a63a;--dot:#ddd5c6;--line:#e3e7ef}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171d2b;--panel:#222b3d;--ink:#e9edf5;--sub:#9aa6bb;--bd:#05070c;--acc:#6f82c8;--accd:#aab9f0;--hl:#2b3652;--ok:#5fc097;--warn:#e8a54a;--bad:#ee7b70;--dot:#27304a;--line:#34405a}}
*{box-sizing:border-box}
body{margin:0;display:grid;grid-template-columns:104px 1fr;min-height:100vh;color:var(--ink);background:radial-gradient(var(--dot) 1.2px,transparent 1.4px) 0 0/22px 22px,var(--bg);font:15px/1.65 "Noto Sans TC","Yu Gothic","Hiragino Sans","Microsoft JhengHei",sans-serif}
#side{position:sticky;top:0;height:100vh;border-right:3px solid var(--bd);background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:16px 8px;gap:6px}
.logo{width:76px;padding:10px 4px;text-align:center;font:900 16px/1.25 "Noto Serif TC",serif;background:var(--panel);border:3px solid var(--bd);border-radius:12px;box-shadow:3px 3px 0 var(--bd);transform:rotate(-3deg);margin-bottom:16px;color:var(--or)}
#tabs{display:flex;flex-direction:column;gap:6px;width:100%}
#tabs button{border:0;background:none;color:var(--sub);font:inherit;font-size:13px;font-weight:500;cursor:pointer;padding:8px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:0}
#tabs button i{font-style:normal;font-size:22px;line-height:1.2}
#tabs button.on{color:var(--ink);background:var(--hl);font-weight:700}
#wrap{min-width:0;padding:14px 26px 50px;max-width:1360px;width:100%}
#top{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;align-items:center}
#top label{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--ink)}
#st{font-size:12px;color:var(--sub);margin-right:auto}
.ttl{text-align:center;margin:8px 0 22px}
.ttl h2{margin:0;font:900 38px/1.2 "Noto Serif TC",serif}
.pill{display:inline-block;margin-top:6px;padding:1px 14px;font-size:13px;font-weight:700;border:2.5px solid var(--bd);border-radius:20px;background:var(--panel);box-shadow:2px 2px 0 var(--bd)}
.panel,.mr,.item{background:var(--panel);border:3px solid var(--bd);border-radius:18px;box-shadow:4px 4px 0 var(--bd)}
.panel{padding:16px 18px;margin-bottom:20px}
.mr{padding:18px 20px;border-top:14px solid var(--acc)}
.md{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:26px;align-items:start}
.ml{display:flex;flex-direction:column;gap:14px;max-height:78vh;overflow:auto;padding:2px 8px 8px 2px}
.item{padding:10px 16px;cursor:pointer;position:relative}
.item b{display:block;font:700 17px/1.4 "Noto Serif TC",serif}
.item span{font-size:13px;color:var(--sub)}
.item.on{background:var(--hl)}
.item.on::after{content:"";position:absolute;right:-13px;top:50%;margin-top:-9px;border:9px solid transparent;border-left:10px solid var(--bd);border-right:0}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--sub);gap:3px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--bd);border-radius:10px;padding:6px 10px;min-width:0}
input[type=checkbox]{accent-color:var(--accd);width:16px;height:16px}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
button.b{font:inherit;font-weight:700;font-size:14px;border:2.5px solid var(--bd);background:var(--panel);color:var(--ink);padding:5px 14px;border-radius:20px;cursor:pointer;box-shadow:2px 2px 0 var(--bd)}
button.b:active{transform:translate(2px,2px);box-shadow:none}
button.b.p{background:var(--or);color:#2b3a4f}
.stats{display:flex;gap:30px;flex-wrap:wrap;margin:4px 0 12px}
.stats div{font-size:12px;color:var(--sub)}
.stats b{display:block;font:900 30px/1.2 "Noto Serif TC",serif;color:var(--ink)}
.stats b.risk{color:var(--bad)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1.5px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--sub);font-weight:700;background:var(--hl)}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--hl)}
.tag{display:inline-block;padding:0 10px;border-radius:12px;font-size:12px;font-weight:700;border:2px solid;background:var(--panel)}
.決定{color:var(--ok)}.假預約{color:var(--warn)}.キャンセル{color:var(--bad)}
.dim td{color:var(--sub);text-decoration:line-through}
.cont{color:var(--accd);font-size:12px;font-weight:700}
.sub td{background:var(--hl)}
dialog{border:3px solid var(--bd);border-radius:18px;box-shadow:6px 6px 0 var(--bd);background:var(--panel);color:var(--ink);width:min(780px,96vw);padding:20px}
dialog::backdrop{background:#2b3a4f99}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.grid .w2{grid-column:span 2}
h3{margin:14px 0 8px;font:700 17px/1.4 "Noto Serif TC",serif}
h3.big{margin:0 0 6px;font-size:26px;font-weight:900}
.empty{color:var(--sub);padding:18px 4px}
.hint{font-size:12.5px;color:var(--sub)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:12px;color:var(--sub);text-align:center;font-weight:700}
.cal .c{min-height:80px;border:2.5px solid var(--bd);border-radius:12px;padding:4px 8px;cursor:pointer;background:var(--panel);position:relative;overflow:hidden}
.cal .c:hover{background:var(--hl)}
.cal .c .d{font-size:12px;color:var(--sub)}
.cal .c .r{font:900 22px/1.2 "Noto Serif TC",serif}
.cal .c .p{font-size:11px;color:var(--sub)}
.cal .c .bg{position:absolute;inset:0;background:var(--or);pointer-events:none}
.cal .c>*:not(.bg){position:relative}
.cal .c.risk{border-color:var(--bad);box-shadow:2px 2px 0 var(--bad)}
.cal .c.risk .r{color:var(--bad)}
@media (max-width:800px){body{grid-template-columns:1fr}#side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;border-right:0;border-top:3px solid var(--bd);z-index:5;padding:4px}.logo{display:none}#tabs{flex-direction:row}#tabs button{flex:1;font-size:11px}#wrap{padding:12px 12px 90px}.md{grid-template-columns:1fr}.ml{max-height:none;flex-direction:row;overflow-x:auto}.item{min-width:200px}.item.on::after{display:none}.ttl h2{font-size:28px}}
.waiting{color:var(--accd)}
.det td{background:var(--hl);padding:6px 14px}.det table{font-size:13px;background:var(--panel)}
.meter{height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}.meter i{display:block;height:100%;background:var(--ok)}
.集客中{color:var(--warn)}.催行{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}.chip{font:inherit;font-size:12.5px;font-weight:700;border:2px solid var(--bd);background:var(--panel);color:var(--ink);padding:0 10px;border-radius:14px;cursor:pointer}.chip.on{background:var(--acc)}
.未{color:var(--sub)}.手仕舞い{color:var(--warn)}.FINAL{color:var(--accd)}.手配OK{color:var(--ok)}
</style>
</head>
<body>
<aside id="side"><div class="logo">團體<br>管理</div>
<nav id="tabs">
  <button data-t="home" class="on"><i>⌂</i>首頁</button>
  <button data-t="day"><i>◴</i>日期</button>
  <button data-t="cal"><i>▦</i>月曆</button>
  <button data-t="rooms"><i>▥</i>房數</button>
  <button data-t="agency"><i>⚑</i>旅行社</button>
  <button data-t="act"><i>✎</i>實績</button>
  <button data-t="all"><i>☰</i>全部</button>
</nav></aside>
<div id="wrap">
<header id="top">
  <span id="st"></span>
  <input id="qs0" type="search" placeholder="🔍 搜尋団体名…" style="width:210px">
  <label title="每團另加給 T/C 與 D 的房數">T/C・D加房<input id="extra" type="number" min="0" style="width:60px"></label>
  <label>總房數<input id="cap" type="number" min="0" style="width:80px"></label>
  <label><input id="inclTent" type="checkbox" checked> 計入假預約</label>
  <button class="b" id="pull" title="從試算表重新讀取">↻ 重新讀取</button>
  <button class="b" id="cfg">⚙ 試算表</button>
  <button class="b" id="imp">匯入</button>
  <button class="b" id="exp">匯出</button>
  <button class="b p" id="add">＋ 新增團體</button>
  <input id="file" type="file" accept=".xlsx,.xls,.csv" hidden>
</header>
<div id="ttl"></div>
<main id="view"></main>
</div>

<dialog id="dlg"><form method="dialog" id="frm"></form></dialog>

<script>
const $=s=>document.querySelector(s);
const DAY=86400000;
const FIELDS=[ // key, 標籤, type, 公司Excel欄名
['cin','C/IN日期','date','C/IN日期'],['cout','C/OUT日期','date','C/OUT日期'],['nights','泊數','number','泊数'],
['received','受付日','date','受付日'],['changed','変更日','date','変更日'],['status','狀態','status','状態'],
['segment','セグメント','text','セグメント'],['name','団体名','text','団体名'],['agency','旅行会社名','text','旅行会社名'],
['office','案内所','text','案内所'],['contact','案内所担当者','text','案内所担当者'],['cond','条件','text','条件'],
['tax','税別（込）','text','税別（込）'],['rooms','室数','number','室数'],['unitRoom','１室単価','number','１室単価'],
['total','宿泊料金','number','宿泊料金'],['unitPerson','１名単価','number','１名単価'],['people','人数','number','人数'],['note','備考','text','備考'],
['custId','客人系統編號','text','客人系統編號'],['tcId','T/C系統編號','text','T/C系統編號'],['dId','D系統編號','text','D系統編號'],
['latest','最新集客人數','number','最新集客人數'],['latestRooms','集客房數','number','集客房數'],['latestAt','人數更新日','date','人數更新日'],['registered','系統登錄','check','已登入系統'],['run','催行狀態','run','催行狀態'],['final','FINAL狀態','fin','是否已FINAL']];
const RUNST=['集客中','催行'];
const FINST=['未','手仕舞い','FINAL','手配OK'];
const normFin=x=>{if(x===true||x===1||x==='1'||x==='✓'||x==='已FINAL')return 'FINAL';const o=String(x??'').trim();return FINST.includes(o)?o:(o.toUpperCase()==='FINAL'?'FINAL':'未')};
const isFinal=g=>{const f=normFin(g.final);return f==='FINAL'||f==='手配OK'};   // 已收到客人名單
const finTag=x=>`<span class="tag ${x}">${x}</span>`;
const hasCust=g=>/\d/.test(String(g.custId??''));
const ACT=[['actSingle','單人房 間數','number','實績_單人房數'],['priceSingle','單人房 單價（每人）','number','實績_單人房單價'],
['actTwin','雙人房 間數','number','實績_雙人房數'],['priceTwin','雙人房 單價（每人）','number','實績_雙人房單價'],
['actTriple','三人房 間數','number','實績_三人房數'],['priceTriple','三人房 單價（每人）','number','實績_三人房單價'],
['actTC','T/C 用房數','number','實績_T/C房數'],['priceTC','T/C 單價','number','實績_T/C單價'],
['actD','D 用房數','number','實績_D房數'],['priceD','D 單價','number','實績_D單價'],
['actPeople','實際入住人數','number','實績_人數'],['actSoine','添い寝人數','number','實績_添い寝人數'],['priceSoine','添い寝單價','number','實績_添い寝單價'],['actOther','その他追加 數量','number','實績_その他數量'],['priceOther','その他追加 單價','number','實績_その他單價'],['otherIn','その他 計入總金額','text','實績_その他計入金額'],['actNote','實績備註','text','實績備註'],['actAt','實績更新日','date','實績更新日']];
const ALLF=FIELDS.concat(ACT);
const STATUS=['決定','假預約','waiting','キャンセル'];
const normStatus=v=>{const o=String(v??'').trim(),t=o.toLowerCase();if(STATUS.includes(o))return o;if(t==='waiting'||o==='キャンセル待ち'||o==='ウェイティング')return 'waiting';if(o==='仮予約'||o==='仮')return '假預約';if(t==='cancel'||o==='ｷｬﾝｾﾙ')return 'キャンセル';return '決定'};
let data=[];let cap=0;let extra=2;let tab='home';let homeMin=90;
try{data=JSON.parse(localStorage.getItem('grp')||'[]');cap=+localStorage.getItem('cap')||0;const ex=localStorage.getItem('extra');if(ex!==null)extra=+ex||0}catch(e){}
const save=()=>{try{localStorage.setItem('grp',JSON.stringify(data));localStorage.setItem('cap',cap);localStorage.setItem('extra',extra)}catch(e){}};

// ---- date helpers
const pd=s=>{if(!s)return null;const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const fd=ms=>{const d=new Date(ms);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')};
const wk=ms=>'日一二三四五六'[new Date(ms).getUTCDay()];
const lab=s=>s?s.slice(5).replace('-','/')+'('+wk(pd(s))+')':'';
const today=()=>{const n=new Date();return fd(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))};
function nightsOf(g){const a=pd(g.cin);if(a==null)return 0;const b=pd(g.cout);return b!=null?Math.max(0,Math.round((b-a)/DAY)):(+g.nights||1)}
const headcount=g=>(g.latest!==''&&g.latest!=null&&!isNaN(g.latest))?+g.latest:(+g.people||0);
const counted=g=>g.status==='決定'||(g.status==='假預約'&&$('#inclTent').checked);
function stays(g,d){const a=pd(g.cin);if(a==null)return false;const x=pd(d);return x>=a&&x<a+nightsOf(g)*DAY}
const nextId=()=>'G'+String(data.reduce((m,g)=>Math.max(m,+(g.id||'G0').slice(1)||0),0)+1).padStart(4,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=n=>(n===''||n==null||isNaN(n))?'':Number(n).toLocaleString();
const tag=s=>`<span class="tag ${s}">${s||'—'}</span>`;

// ---- 連住合併 / 每日統計
const hasLR=g=>g.latestRooms!==''&&g.latestRooms!=null&&!isNaN(g.latestRooms);
const baseRooms=g=>+g.rooms||0;
const isFIT=g=>String(g.segment??'').normalize('NFKC').trim().toUpperCase()==='FIT';
const extraOf=g=>isFIT(g)?0:extra;   // FIT 不另加 T/C・D
const roomsOf=g=>baseRooms(g)+extraOf(g);            // 預約房數（室數＋T/C・D）
const colBase=g=>hasLR(g)?+g.latestRooms:0; // 集客房數（未填視為0）
const rmTxt=g=>roomsOf(g)+(hasLR(g)?'＊':'');
const idKey=g=>[g.custId,g.tcId,g.dId].map(x=>String(x??'').trim()).join('|');
const endOf=g=>g.cin?fd(pd(g.cin)+nightsOf(g)*DAY):'';
let MITEMS=[],MERGE=new Map(),MBYKEY=new Map();
function buildMerge(){
  MITEMS=[];MERGE=new Map();MBYKEY=new Map();const chain=new Map();
  data.forEach(g=>{g.final=normFin(g.final);g.registered=hasCust(g)});
  [...data].sort((a,b)=>(a.cin||'').localeCompare(b.cin||'')||String(a.id).localeCompare(String(b.id))).forEach(g=>{
    const ik=idKey(g);let m=null,sk=null;
    if(ik!=='||'){sk=[ik,g.status].join('#');const p=chain.get(sk);if(p&&p.end===g.cin)m=p}
    if(!m){m={rows:[],key:g.id,nights:0,end:''};MITEMS.push(m);if(sk)chain.set(sk,m)}
    m.rows.push(g);m.nights+=nightsOf(g);m.end=endOf(g);MERGE.set(g.id,m);
  });
  MITEMS.forEach(m=>{m.g=m.rows[0];m.cin=m.g.cin;m.cout=m.end;MBYKEY.set(m.key,m)});
}
function entry(g,d){const m=MERGE.get(g.id)||{rows:[g],nights:nightsOf(g),g,key:g.id,cin:g.cin,cout:endOf(g)};let off=0;for(const r of m.rows){if(r===g)break;off+=nightsOf(r)}return{m,g,night:off+Math.round((pd(d)-pd(g.cin))/DAY)+1,of:m.nights}}
const mEntry=m=>({m,g:m.g,night:0,of:m.nights});
const EMPTY=()=>({rooms:0,colB:0,colX:0,unreg:0,fin:0,people:0,list:[],wait:[]});
function occupancy(){
  const mp=new Map();
  for(const g of data){const w=g.status==='waiting';if(!counted(g)&&!w)continue;
    const a=pd(g.cin);if(a==null)continue;const n=nightsOf(g);
    for(let i=0;i<n;i++){const k=fd(a+i*DAY);let o=mp.get(k);if(!o)mp.set(k,o=EMPTY());const e=entry(g,k);
      if(w){o.wait.push(e);continue}
      o.rooms+=roomsOf(g);if(g.registered){o.colB+=colBase(g);o.colX+=extraOf(g)}else o.unreg++;if(isFinal(g))o.fin++;o.people+=N(g.latest);o.list.push(e)}}
  return mp;
}
const rowAttr=(m,g)=>m.rows.length>1?`data-mg="${esc(m.key)}"`:`data-id="${esc(g.id)}"`;
const mark=(m,k,none)=>m.rows.every(r=>r[k])?'✓':m.rows.some(r=>r[k])?'部分':`<span class="hint">${none}</span>`;
const runTag=x=>x?`<span class="tag ${x}">${x}</span>`:'—';
const uni=(m,f)=>{const v=m.rows.map(f);return v.every(x=>x===v[0])};
const fv=v=>(v===''||v==null||isNaN(v))?'—':num(v);
const NUMHEAD=`<th class="n" title="室數＋T/C・D">預約房數</th><th class="n" title="已系統登錄才計：集客房數（未填為0）＋T/C・D；未登錄顯示 0＋0">集客房數</th><th class="n">預約人數</th><th class="n">集客人數</th>`;
function numCells(m,g,night){
  const cv=(f,fmt)=>(night||uni(m,f))?fmt(f(g)):'<span class="cont">詳細</span>';
  const rm=x=>`${x}＋${extra}`;
  return `<td class="n">${cv(r=>`${N(r.rooms)}＋${extraOf(r)}`,String)}</td><td class="n"><b>${cv(r=>r.registered?`${hasLR(r)?+r.latestRooms:0}＋${extraOf(r)}`:'0＋0',String)}</b></td><td class="n">${cv(r=>r.people??'',fv)}</td><td class="n">${cv(r=>r.latest??'',fv)}</td>`;
}
function groupRows(list,noAg){
  return list.map(({m,g,night,of})=>{const n=m.rows.length;
   const cv=(f,fmt)=>(night||uni(m,f))?fmt(f(g)):'<span class="cont">詳細</span>';
   return `<tr class="click ${g.status==='キャンセル'?'dim':''}" ${rowAttr(m,g)}>
   <td>${esc(g.id)}${n>1?` <span class="cont">×${n}</span>`:''}</td><td>${esc(g.name)}</td>${noAg?'':`<td>${esc(g.agency)}</td>`}<td>${tag(g.status)}</td>
   <td>${lab(m.cin)} → ${lab(m.cout)} ${of>1?`<span class="cont">${night?`第${night}晚/共${of}晚`:`${of}泊`}</span>`:''}</td>
   ${numCells(m,g,night)}<td class="n">${cv(r=>r.unitPerson,num)}</td><td>${cv(r=>r.run||'',runTag)}</td>
   <td>${esc(g.custId)}</td><td>${esc(g.tcId)}</td><td>${esc(g.dId)}</td><td>${mark(m,'registered','未登錄')}</td><td>${cv(r=>normFin(r.final),finTag)}</td><td>${esc(g.note)}</td></tr>`}).join('');
}

const tcdRooms=g=>N(g.actTC)+N(g.actD);
const avgOf=rows=>{const pp=rows.reduce((a,g)=>a+nightsOf(g)*actPpl(g),0),rv=rows.reduce((a,g)=>a+nightsOf(g)*actRev(g),0);return pp?Math.round(rv/pp):null};
const ACTHEAD=`<th class="n">預約房數</th><th class="n">實際入住房數</th><th class="n">預約人數</th><th class="n">實際入住人數</th>`;
function actCells(x){
  const cv=(f,fmt)=>uni(x,f)?fmt(f(x.g)):'<span class="cont">詳細</span>';
  return `<td class="n">${cv(r=>`${N(r.rooms)}＋${extraOf(r)}`,String)}</td><td class="n"><b>${cv(r=>`${guestRooms(r)}＋${tcdRooms(r)}`,String)}</b></td><td class="n">${cv(r=>r.people??'',fv)}</td><td class="n"><b>${cv(actPpl,String)}</b></td>`;
}

     <td>${k===n?'<span class="tag 決定">已輸入</span>':k===0?'<span class="tag 假預約">未輸入</span>':`<span class="tag 假預約">${k}／${n}</span>`}</td>

        save();render();sync({action:'upsert',records:tg.map(toRec)});

  }
  if(!$('#dlg').open)$('#dlg').showModal();
  draw(init(first),'all');

const normV=(t,x)=>t==='check'?!!x:t==='fin'?normFin(x):(x==null?'':String(x));
const show=(t,x)=>t==='fin'?normFin(x):t==='check'?(x?'是':'否'):(x===''||x==null?'（空白）':String(x));
const diffF=(list,o,n)=>list.filter(([k,,t])=>normV(t,o[k])!==normV(t,n[k])).map(([k,l,t])=>({l,old:show(t,o[k]),nw:show(t,n[k])}));
function confirmView(title,changes,onOk,onBack){

  $('#cb').onclick=onBack;$('#cok').onclick=()=>{onOk();$('#dlg').close()};
}

// ---- Excel I/O
const iso=v=>{if(v==null||v==='')return '';if(v instanceof Date)return fd(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate(),12)+0);
  const s=String(v).replace(/[./]/g,'-');const m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);return m?m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0'):''};
function importFile(f){
  const r=new FileReader();r.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    let add=0;
    for(const row of rows){
      const g={id:nextId(),registered:false};
      ALLF.forEach(([k,,t,h])=>{let v=row[h];if(v===undefined)v=row[ALLF.find(x=>x[0]===k)[1]];if(v===undefined)v='';
        if(t==='date')v=iso(v);else if(t==='number')v=v===''?'':+v;else if(t==='fin')v=normFin(v);else if(t==='check')v=v===true||v==='✓'||v==='1'||v==='已登入'||v==='已登錄'||v==='已FINAL';else v=String(v);g[k]=v});
      if(row['編號'])g.id=String(row['編號']);
      g.status=normStatus(g.status);
      if(!g.nights&&g.cin&&g.cout)g.nights=nightsOf(g);
      if(!g.cin&&!g.name)continue;
      data.push(g);add++;
    }
    save();render();alert('已匯入 '+add+' 筆');
    if(add)sync({action:'upsert',records:data.slice(-add).map(toRec)});
  };r.readAsArrayBuffer(f);
}
function exportFile(){
  const rows=data.map(g=>{const o={'編號':g.id};ALLF.forEach(([k,l,t,h])=>o[h]=t==='check'?(g[k]?'✓':''):g[k]);return o});
  const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'團體');
  XLSX.writeFile(wb,'團體預約_'+today()+'.xlsx');
}

// ---- Google 試算表同步
let cfg={};try{cfg=JSON.parse(localStorage.getItem('cfg')||'{}')}catch(e){}
const setSt=(t,bad)=>{const s=$('#st');s.textContent=t;s.style.color=bad?'var(--bad)':'var(--sub)'};
const toRec=g=>{const o={'編號':g.id};ALLF.forEach(([k,,t,h])=>o[h]=t==='check'?(g[k]?'1':''):t==='fin'?normFin(g[k]):(g[k]??''));return o};
function fromRec(r){
  const g={id:String(r['編號'])};
  ALLF.forEach(([k,,t,h])=>{let v=r[h];if(v==null)v='';
    if(t==='date')v=iso(v);else if(t==='number')v=v===''?'':+v;else if(t==='fin')v=normFin(v);else if(t==='check')v=(v===true||v===1||v==='1'||v==='✓');else v=String(v);g[k]=v});
  g.status=normStatus(g.status);
  if(!g.nights&&g.cin&&g.cout)g.nights=nightsOf(g);
  return g;
}
async function sync(body){
  if(!cfg.url)return;setSt('同步中…');
  try{
    const r=await fetch(cfg.url,{method:'POST',body:JSON.stringify({token:cfg.token,...body})});
    const j=await r.json();if(j.error)throw new Error(j.error);
    setSt('已同步 '+new Date().toLocaleTimeString().slice(0,5));
  }catch(e){setSt('同步失敗（資料已存在本機）：'+e.message,true)}
}
async function pull(){
  if(!cfg.url){setSt('尚未設定試算表');return}
  setSt('讀取中…');
  try{
    const r=await fetch(cfg.url+'?token='+encodeURIComponent(cfg.token||''));
    const j=await r.json();if(j.error)throw new Error(j.error);
    const rows=j.rows.filter(x=>x['編號']);
    if(!rows.length&&data.length){
      if(confirm('試算表目前是空的。要把這台電腦上的 '+data.length+' 筆資料上傳到試算表嗎？')){await sync({action:'upsert',records:data.map(toRec)})}
      return;
    }
    data=rows.map(fromRec);save();render();setSt('已讀取 '+rows.length+' 筆 '+new Date().toLocaleTimeString().slice(0,5));
  }catch(e){setSt('讀取失敗（使用本機資料）：'+e.message,true)}
}
function openCfg(){
  $('#frm').innerHTML=`<h3 style="margin-top:0">Google 試算表設定</h3>
   <div class="grid" style="grid-template-columns:1fr"><label>Web App 網址（以 /exec 結尾）<input name="url" value="${esc(cfg.url||'')}" placeholder="https://script.google.com/macros/s/.../exec"></label>
   <label>密碼（與 Code.gs 裡的 TOKEN 相同）<input name="token" type="password" value="${esc(cfg.token||'')}"></label></div>
   <p class="hint">這兩項只存在你這台瀏覽器，不會寫進 GitHub 上的檔案。連線後，試算表是主要資料來源：開啟網頁會自動讀取，儲存時自動寫回。只會讀寫 Code.gs 指定的那一個分頁。</p>
   <div class="bar" style="justify-content:space-between;margin:0"><div><button class="b" value="off">解除連線</button></div>
   <div class="bar" style="margin:0"><button class="b" value="x">取消</button><button class="b p" value="ok">儲存並讀取</button></div></div>`;
  $('#dlg').showModal();
  $('#frm').onsubmit=e=>{const v=e.submitter&&e.submitter.value;
    if(v==='off'){cfg={};localStorage.removeItem('cfg');setSt('');return}
    if(v!=='ok')return;
    const f=new FormData($('#frm'));cfg={url:(f.get('url')||'').trim(),token:f.get('token')||''};
    try{localStorage.setItem('cfg',JSON.stringify(cfg))}catch(e){}
    pull();
  };
}

// ---- wiring
$('#cfg').onclick=openCfg;$('#pull').onclick=pull;
$('#tabs').onclick=e=>{const bt=e.target.closest('button');const t=bt&&bt.dataset.t;if(!t)return;tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b===bt));render()};
$('#view').onclick=e=>{const r=e.target.closest('tr[data-id]');if(r){openEdit(r.dataset.id);return}
  const mg=e.target.closest('tr[data-mg]');if(mg){const nx=mg.nextElementSibling;if(nx&&nx.classList.contains('det'))nx.remove();else mg.insertAdjacentHTML('afterend',detHTML(MBYKEY.get(mg.dataset.mg)))}};
let sT;$('#qs0').oninput=e=>{clearTimeout(sT);sT=setTimeout(()=>{qText=e.target.value;tab='all';document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==='all'));render()},250)};
$('#add').onclick=()=>openEdit('');
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{if(e.target.files[0])importFile(e.target.files[0]);e.target.value=''};
$('#exp').onclick=exportFile;
$('#extra').value=extra;$('#extra').onchange=e=>{extra=+e.target.value||0;save();render()};$('#cap').value=cap||'';$('#cap').onchange=e=>{cap=+e.target.value||0;save();render()};
$('#inclTent').onchange=render;
render();
if(cfg.url)pull();
</script>
</body>
